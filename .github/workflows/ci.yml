name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
          
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check alasmia/ tests/
          
      - name: Type check with mypy
        run: |
          pip install mypy
          mypy alasmia/ --ignore-missing-imports
          
      - name: Run tests
        run: |
          pytest tests/ -v --cov=alasmia --cov-report=xml
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install linting tools
        run: |
          pip install ruff black isort
          
      - name: Check formatting with black
        run: |
          black --check alasmia/ tests/
          
      - name: Check import order with isort
        run: |
          isort --check-only alasmia/ tests/
          
      - name: Run ruff linter
        run: |
          ruff check alasmia/ tests/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install security tools
        run: |
          pip install bandit safety
            
      - name: Run bandit security check
        run: |
          bandit -r alasmia/ -f json -o bandit-report.json || true
          
      - name: Check for known vulnerabilities
        run: |
          safety check --json || true

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Check docs build
        run: |
          # Check that key docs exist
          ls -la README.md CONTRIBUTING.md CHANGELOG.md SECURITY.md VISION.md LICENSE
          
      - name: Verify README structure
        run: |
          python -c "
import re
with open('README.md', 'r') as f:
    content = f.read()
    
# Check required sections
required = ['## 💜', '## ⚡', '## 🌐', '## 👥', '## 🚀', '## 📁', '## 🛡️', '## 🤝', '## 📄']
for section in required:
    if section not in content:
        print(f'Missing: {section}')
        exit(1)
print('All required sections present!')
"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Verify all modules import
        run: |
          python -c "
import alasmia.agent.brain
import alasmia.agent.memory
import alasmia.agent.personality
import alasmia.agent.proactive_engine
import alasmia.agent.interest_tracker
import alasmia.agent.emotional_continuity
import alasmia.agent.shared_experiences
import alasmia.agent.mood_handler
import alasmia.core.scheduler
import alasmia.core.state_manager
import alasmia.core.analytics
import alasmia.core.enhanced_scheduler
import alasmia.integrations.cli_chat
import alasmia.integrations.telegram_bot
import alasmia.integrations.whatsapp_bot
print('All modules import successfully!')
"
          
      - name: Verify main.py works
        run: |
          python main.py --help
